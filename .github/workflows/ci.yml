name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    name: Offline renderer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned renderer dependencies
        run: pnpm install --frozen-lockfile

      - name: Check renderer syntax
        run: pnpm run render:check

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render all 73 cells from the pinned GLB
        run: pnpm run render

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Finalize and validate regenerated atlas
        run: |
          python scripts/finalize_atlas.py --input tmp/robot-atlas.png --render-report tmp/robot-render-report.json
          python -m robot_pet validate pet --json
          python scripts/build_site.py --json

      - name: Test the real Pages build in Chromium
        run: pnpm run test:site

      - name: Upload renderer evidence
        uses: actions/upload-artifact@v7
        with:
          name: robot-expressive-render-evidence
          path: |
            tmp/robot-atlas.png
            tmp/robot-render-report.json
            pet/spritesheet.webp
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src scripts

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Test with branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml

      - name: Build release assets
        run: python scripts/build_release.py --json

      - name: Build Pages site
        run: python scripts/build_site.py --json

      - name: Run strict release gate
        run: python scripts/release_check.py --json --strict

      - name: Upload verified build
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: robot-expressive-release-candidate
          path: |
            dist/
            media/
            site/
          if-no-files-found: error
          retention-days: 14

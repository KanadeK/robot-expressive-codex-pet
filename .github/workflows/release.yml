name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Check pinned renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm run render:check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Verify tag matches package version
        shell: python
        run: |
          from robot_pet.constants import VERSION
          import os
          expected = f"v{VERSION}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match {expected!r}")

      - name: Run quality gate
        run: |
          ruff check .
          mypy src scripts
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Build verified release
        run: python scripts/build_release.py --json

      - name: Run strict release gate
        run: python scripts/release_check.py --json --strict

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/robot-expressive-*.codex-pet.zip
          dist/pet.json
          dist/spritesheet.webp
          dist/SHA256SUMS
          dist/release-manifest.json
          --repo "$GITHUB_REPOSITORY"
          --title "RobotExpressive Codex Pet $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag

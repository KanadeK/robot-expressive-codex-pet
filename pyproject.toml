[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-expressive-codex-pet"
version = "0.1.0"
description = "A validated Codex v2 pet package for the CC0 three.js RobotExpressive character."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "codex",
  "codex-pet",
  "threejs",
  "robot-expressive",
  "desktop-pet",
  "sprite",
  "webgl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
robot-pet = "robot_pet.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/robot-expressive-codex-pet"
Issues = "https://github.com/KanadeK/robot-expressive-codex-pet/issues"
Source = "https://github.com/KanadeK/robot-expressive-codex-pet"

[tool.setuptools.data-files]
"share/licenses/robot-expressive-codex-pet" = ["LICENSE", "ASSET_LICENSE.md", "NOTICE.md"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["build", "dist", "site", ".hatch"]

[tool.coverage.run]
branch = true
source = ["robot_pet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
